# Алиасы — ближайший аналог "scripts" из npm/package.json.
# Использование: cargo run / cargo dev / cargo check-all / ...
[alias]
dev = "run"
release = "run --release"
check-all = "check --all-targets"
test-all = "test --all"
lint = "clippy --all-targets --all-features -- -D warnings"
fmt = "fmt --all"
