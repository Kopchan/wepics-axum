[package]
name = "wepics-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
vips = "0.2"
imagesize = "0.15.0"
lofty = "0.25.5"
matroska = "0.30.1"
mp4parse = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "cors",
    "set-header",
    "fs",
    "compression-br",
    "compression-gzip",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[package.metadata.packager]
product-name = "Wepics Server"
identifier = "com.wepics.wepicserv"
icons = [
    "public/icon/app.ico",
    "public/icon/app24.png",
    "public/icon/app32.png",
    "public/icon/app48.png",
    "public/icon/app64.png",
    "public/icon/app96.png",
    "public/icon/app128.png",
    "public/icon/app192.png",
    "public/icon/app256.png",
    "public/icon/app512.png"
]

[package.metadata.packager.nsis]
installer-icon = "public/icon/app.ico"
