[package]
name = "wepics-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
vips = "0.2"
imagesize = "0.15"
lofty = "0.25"
matroska = "0.30"
mp4parse = "0.17"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
dashmap = "6.1"
brotli = "7.0"
flate2 = "1.0"
httpdate = "1"
mime_guess = "2"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "cors",
    "set-header",
    "fs",
    "compression-br",
    "compression-gzip",
] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Wepics Server"
FileDescription = "Wepics Server — Media Gallery"

[package.metadata.packager]
product-name = "Wepics Server"
description = "Wepics Server — Media Gallery"
identifier = "com.wepics.wepicserv"
# The installer copies these next to the binary. `PUBLIC_DIR` then resolves to
# `public` beside the executable, together with the `data` root.
resources = [{ src = "public", target = "public" }]
icons = [
    "public/assets/icon/app.ico",
    "public/assets/icon/app24.png",
    "public/assets/icon/app32.png",
    "public/assets/icon/app48.png",
    "public/assets/icon/app64.png",
    "public/assets/icon/app96.png",
    "public/assets/icon/app128.png",
    "public/assets/icon/app192.png",
    "public/assets/icon/app256.png",
    "public/assets/icon/app512.png"
]

[package.metadata.packager.nsis]
installer-icon = "public/assets/icon/app.ico"
