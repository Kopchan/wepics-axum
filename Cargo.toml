[package]
name = "wepics-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
imagesize = "0.15.0"
kamadak-exif = "0.6.1"
lofty = "0.25.5"
matroska = "0.30.1"
mp4parse = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header", "fs"] }

[dev-dependencies]
tempfile = "3"
